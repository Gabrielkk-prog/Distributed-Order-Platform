apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: meu-sistema-distribuido
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service-container
          image: seu-usuario-dockerhub/order-service:latest
          ports:
            - containerPort: 8088
          env:
            - name: DB_URL
              value: "jdbc:postgresql://postgres:5432/stock_db"
            - name: DB_USERNAME
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: meu-sistema-distribuido
spec:
  selector:
    app: order-service
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
