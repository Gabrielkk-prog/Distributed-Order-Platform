spring.application.name=order-service-test

# Diz ao Spring para usar o driver do Testcontainers que gerencia o ciclo de vida do Docker
spring.datasource.url=jdbc:tc:postgresql:16:///order_db?TC_INITSCRIPT=file:src/test/resources/schema.sql
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Desativa o Kafka real durante os testes (ou use um container do Kafka se necessário)
spring.kafka.bootstrap-servers=false
