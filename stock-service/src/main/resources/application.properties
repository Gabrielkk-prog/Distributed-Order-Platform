server.port=8088

spring.application.name=stock-service

# Configuração do Banco de Dados (Ajustado para rodar local acessando o Docker na porta 5443)
spring.datasource.url=jdbc:postgresql://localhost:5443/stock_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ==========================================
# ADICIONADO: Configurações do Apache Kafka
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=stock-service
spring.kafka.consumer.auto-offset-reset=earliest

# Passamos as classes e propriedades como texto puro para evitar conflitos e warnings
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Confia em todos os pacotes e define para qual classe o JSON deve ser convertido
spring.json.trusted.packages=*
spring.json.value.default.type=com.plataforma.stock.dto.OrderCreatedEvent
